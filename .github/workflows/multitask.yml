name: multitask

# orOS multitasking measured on the stick (scripts/test-multitask.sh):
# the latest released image, a test copy of orOS (a branch of
# koulaxizis/oros), QEMU with 4 GB and 2 CPUs. A report, never a gate.
on:
  pull_request:
    paths:
      - .github/workflows/multitask.yml
      - scripts/test-multitask.sh
      - scripts/qa-mt.js
  workflow_dispatch:
    inputs:
      oros_ref:
        description: "koulaxizis/oros branch or tag to measure"
        required: false
        default: main

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Tools
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates curl git xorriso squashfs-tools \
            qemu-system-x86 qemu-utils ovmf socat netpbm fdisk parted e2fsprogs util-linux udev python3
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: koulaxizis/oros
          ref: ${{ inputs.oros_ref || 'main' }}
          path: oros-src
      - name: Latest released image
        run: |
          URL="$(curl -fsSL https://api.github.com/repos/koulaxizis/oros-usb/releases?per_page=1 \
            | grep -o '"browser_download_url": *"[^"]*\.iso"' | head -1 | grep -o 'https://[^"]*')"
          echo "$URL"
          curl -fsSL -o /tmp/oros-usb.iso "$URL"
      - name: Measure
        run: scripts/test-multitask.sh /tmp/oros-usb.iso oros-src test-out/multitask
      - name: Report
        if: always()
        run: |
          cat test-out/multitask/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat test-out/multitask/steps.jsonl 2>/dev/null || true
      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multitask
          path: |
            test-out/multitask/*.png
            test-out/multitask/*.tsv
            test-out/multitask/*.jsonl
            test-out/multitask/report.md
            test-out/multitask/serial.log
