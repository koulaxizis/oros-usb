name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # The monthly system: new Chromium, kernel and firmware from Debian, and
  # the latest orOS. A tested build is released; "Update system" on the
  # stick installs it.
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create on this commit, e.g. v0.1.0 (empty: test build only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Tools
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends live-build golang-go git ca-certificates \
            debootstrap xorriso squashfs-tools dosfstools mtools grub-efi-amd64-bin grub-pc-bin \
            syslinux syslinux-common isolinux qemu-system-x86 qemu-utils ovmf socat netpbm \
            fdisk parted e2fsprogs util-linux udev tesseract-ocr ntfs-3g unzip curl initramfs-tools-core \
            gnupg gpgv xz-utils jq
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) TAG="$GITHUB_REF_NAME" ;;
          esac
          # Monthly builds are betas until orOS USB leaves beta.
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then TAG="v$(date -u +%Y.%m.%d)-beta"; fi
          if [ -n "$TAG" ]; then
            case "$TAG" in v[0-9]*) ;; *) echo "bad tag: $TAG"; exit 1;; esac
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Unit tests (oros-system)
        run: cd system && go test ./...
      - name: Tor button download (the real Tor Browser from torproject.org)
        run: |
          scripts/tor-key.sh /tmp/tor-key.gpg
          (cd system && go run . tor --fetch --no-start --dir /tmp/tor --keyring /tmp/tor-key.gpg --progress /tmp/tor.json)
          cat /tmp/tor.json; echo
          test -x /tmp/tor/tor-browser/Browser/start-tor-browser
          rm -rf /tmp/tor
      - name: Session watchdog test (fake cage, no VM)
        run: scripts/test-session-watchdog.sh
      - name: Build image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/build.sh "${{ steps.v.outputs.version }}"
      - name: Boot menus in the image
        run: |
          ISO="out/orOS-USB-${{ steps.v.outputs.version }}.iso"
          for f in boot/grub/grub.cfg boot/grub/config.cfg isolinux/isolinux.cfg isolinux/menu.cfg; do
            echo "== $f"; rm -f /tmp/menu
            xorriso -osirrox on -indev "$ISO" -extract "/$f" /tmp/menu >/dev/null 2>&1 && head -60 /tmp/menu || echo "(none)"
          done
      - name: Licences and sources on the stick
        run: |
          V="${{ steps.v.outputs.version }}"
          rm -rf /tmp/notices && mkdir /tmp/notices
          for f in CREDITS.txt WRITTEN-OFFER.txt SOURCES.txt; do
            xorriso -osirrox on -indev "out/orOS-USB-$V.iso" -extract "/$f" "/tmp/notices/$f" >/dev/null 2>&1
            test -s "/tmp/notices/$f" || { echo "::error::$f missing on the ISO"; exit 1; }
          done
          grep -Eq '^linux(-signed-amd64)? ' /tmp/notices/SOURCES.txt
          grep -q '^chromium ' /tmp/notices/SOURCES.txt
          grep -q '^cage ' /tmp/notices/SOURCES.txt
          grep -q '^cups ' /tmp/notices/SOURCES.txt
          grep -q '^bluez ' /tmp/notices/SOURCES.txt
          cmp /tmp/notices/SOURCES.txt "out/orOS-USB-$V-sources.txt"
          test -s "out/orOS-USB-$V-packages.txt"
          echo "$(grep -c snapshot.debian.org/package /tmp/notices/SOURCES.txt) source packages listed"
      - name: Boot test (QEMU, UEFI Secure Boot, persistence)
        run: scripts/test-boot.sh "out/orOS-USB-${{ steps.v.outputs.version }}.iso" test-out
      - name: Watchdog test (two starts that never show orOS, then the GPU off)
        run: WATCHDOG_TEST=2 BOOT_WAIT=420 scripts/test-boot.sh "out/orOS-USB-${{ steps.v.outputs.version }}.iso" test-out/watchdog
      - name: Rufus stick test (files on FAT32, ext3 persistence keeping the whole system)
        # Reproduces Chris's real-PC first start; reported, not yet blocking.
        continue-on-error: true
        run: scripts/test-rufus.sh "out/orOS-USB-${{ steps.v.outputs.version }}.iso" test-out/rufus
      - name: Install test (install to a disk, boot it without the stick)
        run: scripts/test-install.sh "out/orOS-USB-${{ steps.v.outputs.version }}.iso" test-out/install
      - name: Combo stick test (image + orOS Portable on NTFS, then boot it)
        run: |
          curl -fsSL -o /tmp/portable.zip https://github.com/koulaxizis/oros-portable/releases/download/v0.1.0/orOS-Portable-lite-0.1.0.zip
          scripts/test-combo-sticks.sh "out/orOS-USB-${{ steps.v.outputs.version }}.iso" /tmp/portable.zip test-out/combo
      - name: Update test (system update onto the persistence partition, then boot it)
        run: scripts/test-update.sh "out/orOS-USB-${{ steps.v.outputs.version }}.iso" test-out/update
      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: |
            test-out/*.png
            test-out/*.log
            test-out/install/*.png
            test-out/install/*.log
            test-out/install/*.json
            test-out/combo/*.png
            test-out/combo/*.log
            test-out/update/*.png
            test-out/update/*.log
            test-out/watchdog/*.png
            test-out/watchdog/*.log
            test-out/rufus/*.png
            test-out/rufus/*.log
            test-out/*.txt
            build.log
          retention-days: 14
      - name: Image
        uses: actions/upload-artifact@v4
        with:
          name: orOS-USB
          path: |
            out/*.iso
            out/*.txt
          retention-days: 14
          compression-level: 0
      # A tag push, a manual run with a tag, or the monthly run. The tag is
      # created on the commit that was built and tested.
      - name: Release
        if: steps.v.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          apt-get install -y -q gh
          TITLE="orOS USB $VERSION"
          NOTES="Write the ISO to a USB stick (Rufus, balenaEtcher or dd); see README. Sticks with orOS already on them get this system with System › System update; files and settings stay. Source code: the -sources.txt file names the exact Debian source package of every program (also SOURCES.txt on the stick, with CREDITS.txt and WRITTEN-OFFER.txt)."
          # A beta is a normal release (System update finds it through
          # releases/latest), named and described as a beta.
          case "$TAG" in *beta*)
            TITLE="$TITLE (Beta)"
            BETA_EN="Beta: for testing. Some PCs show a white screen on the very first start (restarting fixes it). Please send System › Problem report when something goes wrong."
            BETA_EL="Beta: για δοκιμές. Σε μερικά PC η πρώτη εκκίνηση δείχνει λευκή οθόνη (η επανεκκίνηση το διορθώνει). Στείλε Σύστημα › Αναφορά προβλήματος όταν κάτι δεν πάει καλά."
            NOTES="$(printf '%s\n\n%s\n\n%s' "$BETA_EN" "$BETA_EL" "$NOTES")" ;;
          esac
          scripts/update-assets.sh "out/orOS-USB-$VERSION.iso" out/update "$VERSION"
          gh release create "$TAG" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            "out/orOS-USB-$VERSION.iso" out/update/update.json out/update/filesystem.squashfs out/update/vmlinuz out/update/initrd.img \
            "out/orOS-USB-$VERSION-sources.txt" "out/orOS-USB-$VERSION-packages.txt" \
            --title "$TITLE" --notes "$NOTES"
