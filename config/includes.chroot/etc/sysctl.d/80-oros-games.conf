# Games (orOS USB G1). The values SteamOS and Fedora use:
# - many memory maps: some Windows games under Proton (and some native
#   ones) crash with the kernel's default of 65530.
vm.max_map_count = 2147483642
# - no forced slow-down of programs that use split locks (some games do
#   it all the time and stutter badly with it on).
kernel.split_lock_mitigate = 0
