# NetworkManager's unit makes /home read-only for it (ProtectHome), but
# orOS keeps the saved networks in /home/.oros-network (see
# /etc/NetworkManager/conf.d/oros.conf); without this it cannot save any
# network ("settings plugin does not support adding connections").
[Unit]
After=systemd-tmpfiles-setup.service

[Service]
ReadWritePaths=-/home/.oros-network
