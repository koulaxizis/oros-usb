# Flatpak apps (games, the software center's programs) use the GTK portal
# for file dialogs and the like; labwc has no portal of its own.
# Sharing or recording the screen (Chromium's getDisplayMedia: orOS Screen
# Capture, Quick settings' Screen recording) and screenshots go to the wlr
# portal, which works with labwc (QS-REC-1).
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
